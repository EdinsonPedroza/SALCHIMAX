<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promos · Idea 4 — Vitrina limpia</title>
<link rel="stylesheet" href="_shared.css">
<link rel="stylesheet" href="_wall.css">
<style>
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(18px, 2.2vw, 32px); align-items: start; }

  /* Vitrina limpia con la foto como protagonista: ocupa todo el ancho de la tarjeta (de borde a borde)
     y manda en altura. El texto va debajo, compacto; el color de la promo solo toca el día, el sello,
     el precio y el botón. */
  .nc { position: relative; display: flex; flex-direction: column; container-type: inline-size; background: #151515; border: 1px solid rgba(244, 239, 230, 0.14); border-radius: 12px; transition: transform 320ms var(--ease-out), border-color 240ms var(--ease-out); }
  .nc:not(.in) { opacity: 0; }
  .nc.in { animation: up 760ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 100ms); }
  @keyframes up { from { opacity: 0; transform: translateY(42px); } }

  /* Foto a sangre: casi cuadrada, sin degradados ni textos encima */
  .ph { position: relative; aspect-ratio: 25 / 24; overflow: hidden; border-radius: 11px 11px 0 0; background: #0a0a0a; }
  .ph img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); transition: transform 1000ms var(--ease-out); }
  .nc.in .ph { animation: reveal 950ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 100ms + 60ms); }
  @keyframes reveal { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  .sheen { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.2) 50%, transparent 62%); transform: translateX(-130%); }

  .info { display: flex; flex-direction: column; flex: 1; padding: 4.6cqi 5.5cqi 5.4cqi; }

  /* Línea del día: pequeña, para no competir con la foto */
  .eb { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .day { display: flex; overflow: hidden; padding: 0.16em 0 0.02em; margin-top: -0.16em; font-family: var(--f-head); font-weight: 400; font-size: clamp(1.3rem, 8.6cqi, 1.95rem); line-height: 0.9; letter-spacing: 0.08em; color: var(--c); }
  .day i { display: inline-block; font-style: normal; }
  .nc.in .day i { animation: rise 640ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 100ms + var(--k) * 34ms + 420ms); }
  .tag { flex: none; padding: 1cqi 3cqi 0.2cqi; border: 1.5px solid var(--c); border-radius: 5px; color: var(--c); font-family: var(--f-head); font-size: clamp(0.95rem, 6.2cqi, 1.3rem); line-height: 1; letter-spacing: 0.06em; }
  .nc.in .tag { animation: stamp 440ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 100ms + 800ms); }
  @keyframes stamp { from { opacity: 0; transform: scale(1.9) rotate(-14deg); } 45% { opacity: 1; } }

  .ti { margin-top: 2.2cqi; font-family: var(--f-head); font-weight: 400; font-size: clamp(1.5rem, 10.6cqi, 2.3rem); line-height: 0.96; letter-spacing: 0.01em; }
  .de { margin-top: 1.8cqi; font-size: clamp(0.78rem, 4.3cqi, 0.9rem); font-weight: 600; line-height: 1.38; color: rgba(255, 255, 255, 0.64); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 4.14em; }
  .ft { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; margin-top: auto; padding-top: 3.6cqi; }
  .pr { font-family: var(--f-head); font-size: clamp(1.9rem, 13.5cqi, 2.9rem); line-height: 0.9; color: var(--c); }
  .go { display: inline-flex; align-items: center; gap: 8px; padding: 0.5em 0.9em 0.4em; border: 2px solid var(--c); border-radius: 6px; color: var(--c); font-family: var(--f-head); font-size: clamp(1rem, 6.2cqi, 1.3rem); letter-spacing: 0.1em; line-height: 1; transition: background-color 220ms var(--ease-out), color 220ms var(--ease-out); }
  .go svg { transition: transform 240ms var(--ease-out); }

  .hoy { position: absolute; z-index: 4; left: 50%; top: -14px; translate: -50% 0; display: flex; align-items: center; gap: 7px; padding: 5px 12px 3px; border: 2px solid var(--c); border-radius: 999px; background: var(--ink); color: #fff; font-family: var(--f-head); font-size: 1.15rem; letter-spacing: 0.12em; line-height: 1; }
  .hoy i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); animation: blink 1.2s ease-in-out infinite; }

  @media (hover: hover) and (pointer: fine) {
    .nc:hover { transform: translateY(-8px); border-color: var(--c); }
    .nc:hover .ph img { transform: scale(1.08); }
    .nc:hover .sheen { animation: sheen 900ms var(--ease-out); }
    .nc:hover .go { background: var(--c); color: var(--ink); }
    .nc:hover .go svg { transform: translateX(4px); }
  }
  .nc:active { transform: translateY(-3px) scale(0.985); }
  @keyframes sheen { to { transform: translateX(130%); } }

  @media (max-width: 1000px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 38px; } }
  @media (max-width: 520px) { .cards { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; } }

  @media (prefers-reduced-motion: reduce) {
    .nc.in, .nc.in .day i, .nc.in .tag, .nc.in .ph, .hoy i { animation: none; }
    .nc, .ph img, .go, .go svg { transition: none; }
  }
</style>
</head>
<body>
<main class="wall">
  <div class="marquee tape t1" aria-hidden="true"><div class="marquee-track" id="m1"></div></div>

  <header class="head">
    <span class="eyebrow">Cada día una excusa para comer</span>
    <h2 class="h2">
      <span class="stroke" id="stroke" aria-label="Promos"></span>
      <span class="hl">DE LA SEMANA</span>
    </h2>
    <a class="today" href="#cards"><span class="dot"></span><span id="todayT"></span></a>
  </header>

  <div class="stage"><div class="cards" id="cards"></div></div>

  <div class="marquee tape t2 rev" aria-hidden="true"><div class="marquee-track" id="m2"></div></div>
</main>

<script src="_shared.js"></script>
<script src="_wall.js"></script>
<script>
const ARROW = '<svg width="20" height="13" viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M0 7h19M13 1l6 6-6 6"/></svg>';
const cards = $("#cards");
PROMOS.forEach((p, i) => {
  const a = document.createElement("a");
  a.className = "nc";
  a.href = promoWa(p); a.target = "_blank"; a.rel = "noopener";
  a.style.cssText = `--c:${p.c};--i:${i}`;
  a.innerHTML = `
    ${i === TODAY_I ? '<span class="hoy"><i></i>HOY</span>' : ""}
    <div class="ph"><img src="${p.img}" alt="${p.title}" loading="lazy" draggable="false"><span class="sheen"></span></div>
    <div class="info">
      <div class="eb">
        <h3 class="day" aria-label="${p.day}">${[...p.day.toUpperCase()].map((ch, k) => `<i style="--k:${k}" aria-hidden="true">${ch}</i>`).join("")}</h3>
        <span class="tag">${p.badge}</span>
      </div>
      <h4 class="ti">${p.title}</h4>
      <p class="de">${p.desc}</p>
      <div class="ft"><span class="pr">${p.price}</span><span class="go">PEDIR ${ARROW}</span></div>
    </div>`;
  cards.appendChild(a);
});
revealOnView(".nc", 0.18);
</script>
</body>
</html>
