<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menú · Idea 2 — Bento de tinta</title>
<link rel="stylesheet" href="_shared.css">
<link rel="stylesheet" href="_menu.css">
<style>
  /* Categorías: botones macizos con sombra dura */
  .chips { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto clamp(22px, 2.6vw, 34px); display: flex; flex-wrap: wrap; gap: 12px 14px; }
  .chip { position: relative; padding: 10px 18px 7px; border: 3px solid var(--paper); background: var(--ink); color: var(--paper); font-family: var(--f-head); font-size: clamp(1.15rem, 1.7vw, 1.5rem); letter-spacing: 0.1em; line-height: 1; transition: transform 160ms var(--ease-out), background-color 200ms var(--ease-out), color 200ms var(--ease-out), border-color 200ms var(--ease-out); }
  .chip::before { content: ""; position: absolute; inset: -3px; z-index: -1; background: var(--paper); transform: translate(5px, 5px); transition: transform 160ms var(--ease-out); }
  .chip small { margin-left: 8px; font-family: var(--f-body); font-size: 0.64rem; font-weight: 800; letter-spacing: 0.1em; opacity: 0.6; }
  .chip[aria-pressed="true"] { background: var(--orange); border-color: var(--ink); color: var(--ink); transform: translate(4px, 4px); }
  .chip[aria-pressed="true"]::before { transform: translate(1px, 1px); background: var(--paper); }
  .chip:active { transform: translate(4px, 4px); }
  .chip:active::before { transform: translate(1px, 1px); }
  @media (hover: hover) and (pointer: fine) { .chip[aria-pressed="false"]:hover { transform: translate(-2px, -2px); } .chip[aria-pressed="false"]:hover::before { transform: translate(7px, 7px); } }

  /* Bento: el primer plato manda (2×2) y el resto lo rodea */
  .bento { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: clamp(220px, 21vw, 290px); grid-auto-flow: dense; gap: clamp(12px, 1.6vw, 22px); }
  .bento.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile { position: relative; display: flex; flex-direction: column; overflow: hidden; background: #151515; border: 2px solid rgba(244, 239, 230, 0.2); cursor: pointer; outline-offset: 3px; animation: tin 480ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 55ms); }
  .tile.big { grid-column: span 2; grid-row: span 2; }
  @media (min-width: 1001px) { .tile.wide { grid-column: span var(--span); } }
  @keyframes tin { from { opacity: 0; transform: scale(0.94); } }

  .ph { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #0a0a0a; }
  .ph img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); transition: transform 900ms var(--ease-out); }
  .cap { flex: none; display: flex; align-items: stretch; justify-content: space-between; gap: 10px; background: var(--ink); border-top: 2px solid rgba(244, 239, 230, 0.2); }
  .cap h3 { align-self: center; padding: 10px 0 8px 14px; font-family: var(--f-head); font-weight: 400; font-size: clamp(1.25rem, 1.8vw, 1.65rem); line-height: 1; letter-spacing: 0.02em; }
  .tile.big .cap h3 { font-size: clamp(1.7rem, 2.8vw, 2.6rem); padding-block: 14px 11px; }
  .pr { flex: none; display: grid; place-items: center; padding: 0 14px; background: var(--orange); color: var(--ink); font-family: var(--f-head); font-size: clamp(1.25rem, 1.8vw, 1.65rem); line-height: 1; letter-spacing: 0.02em; }
  .tile.big .pr { font-size: clamp(1.7rem, 2.8vw, 2.6rem); padding: 0 20px; }
  .pr small { display: block; font-family: var(--f-body); font-size: 0.55rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; }

  /* "Tinta": un círculo naranja nace donde pasas el mouse o tocas y descubre el detalle */
  .rev { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: clamp(14px, 1.6vw, 22px); background: var(--orange); color: var(--ink); visibility: hidden; clip-path: circle(0px at var(--x, 50%) var(--y, 50%)); transition: clip-path 560ms var(--ease-out), visibility 0s linear 560ms; }
  .tile.open .rev { visibility: visible; clip-path: circle(160% at var(--x, 50%) var(--y, 50%)); transition: clip-path 620ms var(--ease-out), visibility 0s; }
  .rev h4 { font-family: var(--f-head); font-weight: 400; font-size: clamp(1.8rem, 2.6vw, 2.6rem); line-height: 0.95; }
  .tile.big .rev h4 { font-size: clamp(2.6rem, 4.4vw, 4.4rem); }
  .rev p { margin-top: 6px; font-size: clamp(0.82rem, 1vw, 0.98rem); font-weight: 700; line-height: 1.4; }
  .tile.big .rev p { font-size: clamp(0.98rem, 1.3vw, 1.2rem); }
  .rev .opts { color: var(--ink); }
  .rev .opt[aria-pressed="true"] { background: var(--ink); color: var(--orange); }
  .rev .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .rev .big-p { font-family: var(--f-head); font-size: clamp(2rem, 3vw, 3.2rem); line-height: 0.9; }
  .add { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px 7px; background: var(--ink); color: var(--orange); font-family: var(--f-head); font-size: 1.15rem; letter-spacing: 0.12em; line-height: 1; transition: transform 160ms var(--ease-out), background-color 180ms var(--ease-out); }
  .add:active { transform: scale(0.95); }
  .add.done { background: #1f9d55; color: #fff; }
  .x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; display: grid; place-items: center; background: var(--ink); color: var(--orange); font-size: 1.2rem; font-weight: 800; line-height: 1; }

  @media (hover: hover) and (pointer: fine) { .tile:hover .ph img { transform: scale(1.07); } .tile.open .ph img { transform: scale(1.07); } .x { display: none; } }
  .hint { position: relative; z-index: 2; max-width: 1280px; margin: 18px auto 0; font-size: 11px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255, 255, 255, 0.42); }

  @media (max-width: 1000px) { .bento, .bento.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: clamp(190px, 38vw, 280px); } .tile.big { grid-column: 1 / -1; grid-row: span 2; } }
  @media (max-width: 520px) { .bento, .bento.c3 { grid-auto-rows: 230px; gap: 10px; } .tile.big { grid-row: span 2; } .cap h3 { font-size: 1.15rem; padding-left: 10px; } .pr { padding: 0 10px; font-size: 1.15rem; } .rev { padding: 12px; } .rev h4 { font-size: 1.6rem; } .rev p { font-size: 0.78rem; } }

  @media (prefers-reduced-motion: reduce) {
    .tile { animation: none; }
    .rev, .tile.open .rev, .ph img, .chip, .chip::before { transition: none; }
  }
</style>
</head>
<body>
<main class="mwrap">
  <header class="mhead">
    <span class="eyebrow">Lo que más te gusta</span>
    <h2 class="mh2" aria-label="Nuestro menú"><span class="stroke" id="mstroke"></span><span class="hl" aria-hidden="true">MENÚ</span></h2>
  </header>

  <div class="chips" id="chips" role="tablist" aria-label="Categorías"></div>
  <div class="bento" id="bento" role="tabpanel"></div>
  <p class="hint" id="hint"></p>
</main>

<script src="_shared.js"></script>
<script src="_menu.js"></script>
<script>
grain(); mountMenuHead(); mountCart();
const chips = $("#chips"), bento = $("#bento");
$("#hint").textContent = FINE ? "Pasa el mouse por un plato · clic para fijarlo" : "Toca un plato para ver el detalle";
let current = "salchipapas";

MENU_CATS.forEach((c) => {
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("role", "tab");
  b.innerHTML = `${c.label.toUpperCase()}<small>${MENU[c.id].length}</small>`;
  b.setAttribute("aria-pressed", String(c.id === current)); b.setAttribute("aria-selected", String(c.id === current));
  b.addEventListener("click", () => { current = c.id; $$(".chip", chips).forEach((x) => { const on = x === b; x.setAttribute("aria-pressed", String(on)); x.setAttribute("aria-selected", String(on)); }); render(); });
  chips.appendChild(b);
});

function render() {
  const items = MENU[current];
  bento.innerHTML = "";
  bento.classList.toggle("c3", items.length <= 3);
  // Relleno: si la última fila queda corta, el último plato la completa (solo en 4 columnas)
  const others = items.length - 1, cols = items.length <= 3 ? 3 : 4;
  items.forEach((item, i) => {
    const opts = portions(item); let sel = 0;
    const t = document.createElement("article");
    t.className = "tile" + (i === 0 ? " big" : ""); t.tabIndex = 0; t.style.setProperty("--i", i);
    t.innerHTML = `
      <div class="ph"><img src="${item.img}" alt="${item.name}" loading="lazy" draggable="false"></div>
      <div class="cap"><h3>${item.name}</h3><span class="pr">${opts ? `<span><small>Desde</small>${item.price}</span>` : item.price}</span></div>
      <div class="rev" aria-hidden="true">
        <button class="x" aria-label="Cerrar">×</button>
        <div><h4>${item.name}</h4><p>${item.desc}</p></div>
        ${opts ? `<div class="opts" role="group" aria-label="Porción">${opts.map((o, k) => `<button class="opt" aria-pressed="${k === 0}" data-k="${k}" tabindex="-1">${o.label}<b>${o.price}</b></button>`).join("")}</div>` : ""}
        <div class="foot"><span class="big-p">${opts ? opts[0].price : item.price}</span><button class="add" tabindex="-1">+ AGREGAR</button></div>
      </div>`;
    // última fila corta → el último plato la completa
    if (items.length > 3 && i === items.length - 1 && i > 0) { const r = (others - 4) % 4; const left = r > 0 ? (4 - r) % 4 : 0; if (left > 0) { t.style.setProperty("--span", 1 + left); t.classList.add("wide"); } }

    const setOpen = (o, e) => {
      if (o && e) { const r = t.getBoundingClientRect(); t.style.setProperty("--x", `${e.clientX - r.left}px`); t.style.setProperty("--y", `${e.clientY - r.top}px`); }
      t.classList.toggle("open", o);
      const rev = $(".rev", t); rev.setAttribute("aria-hidden", String(!o));
      $$(".opt, .add", t).forEach((b) => (b.tabIndex = o ? 0 : -1));
    };
    // Mouse: el hover abre y cierra; el clic lo "fija" (queda abierto aunque salgas). Táctil/teclado: abre y cierra con toque o Enter.
    let pinned = false;
    if (FINE) {
      t.addEventListener("pointerenter", (e) => setOpen(true, e));
      t.addEventListener("pointerleave", () => { if (!pinned) setOpen(false); });
    }
    t.addEventListener("click", (e) => {
      if (e.target.closest(".opt, .add")) return;
      if (FINE) { pinned = !pinned; setOpen(pinned || t.matches(":hover"), e); }
      else setOpen(!t.classList.contains("open"), e);
    });
    $(".x", t).addEventListener("click", (e) => { e.stopPropagation(); pinned = false; setOpen(false); });
    t.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target === t) setOpen(!t.classList.contains("open"));
      if (e.key === "Escape") { pinned = false; setOpen(false); }
    });
    $$(".opt", t).forEach((b) => b.addEventListener("click", () => { sel = +b.dataset.k; $$(".opt", t).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); $(".big-p", t).textContent = opts[sel].price; }));
    const add = $(".add", t);
    add.addEventListener("click", () => { cartAdd(); add.classList.add("done"); add.textContent = "AGREGADO ✓"; setTimeout(() => { add.classList.remove("done"); add.textContent = "+ AGREGAR"; }, 1500); });
    bento.appendChild(t);
  });
}
render();
</script>
</body>
</html>
