<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promos · Idea 4 — Vitrina de neón</title>
<link rel="stylesheet" href="_shared.css">
<link rel="stylesheet" href="_wall.css">
<style>
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(18px, 2.2vw, 32px); align-items: start; }

  /* Tarjeta oscura con marco de neón fino. La foto va limpia: nada se apila encima del producto. */
  .nc { --glow: color-mix(in srgb, var(--c) 40%, transparent); position: relative; display: flex; flex-direction: column; container-type: inline-size; background: #151515; border-radius: 12px; isolation: isolate; transition: transform 320ms var(--ease-out); }
  .nc:not(.in) { opacity: 0; }
  .pad { display: flex; flex-direction: column; flex: 1; padding: 5.5cqi 5.5cqi 6cqi; }

  .neon { position: absolute; inset: 0; z-index: 3; pointer-events: none; border: 2px solid var(--c); border-radius: 12px; box-shadow: 0 0 12px var(--glow); }
  .neon::after { content: ""; position: absolute; inset: -2px; border-radius: 14px; box-shadow: 0 0 34px 2px var(--glow); opacity: 0; transition: opacity 320ms var(--ease-out); }

  /* Fila superior: día y sello, fuera de la foto */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4cqi; }
  .day { display: flex; overflow: hidden; padding: 0.16em 0 0.02em; margin-top: -0.16em; font-family: var(--f-head); font-weight: 400; font-size: clamp(1.9rem, 13.5cqi, 3.1rem); line-height: 0.9; letter-spacing: 0.02em; color: var(--c); }
  .day i { display: inline-block; font-style: normal; }
  .nc.in .day i { animation: rise 640ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 100ms + var(--k) * 34ms + 300ms); }
  .tag { flex: none; padding: 1.4cqi 3.6cqi 0.4cqi; border: 2px solid var(--c); border-radius: 6px; color: var(--c); font-family: var(--f-head); font-size: clamp(1.1rem, 8cqi, 1.6rem); line-height: 1; letter-spacing: 0.06em; transform: rotate(3deg); }
  .nc.in .tag { animation: stamp 440ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 100ms + 760ms); }
  @keyframes stamp { from { opacity: 0; transform: scale(1.9) rotate(-16deg); } 45% { opacity: 1; } to { transform: scale(1) rotate(3deg); } }

  /* Foto sin degradados ni textos encima */
  .ph { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 8px; background: #0a0a0a; }
  .ph img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); transition: transform 900ms var(--ease-out); }
  .sheen { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.2) 50%, transparent 62%); transform: translateX(-130%); }

  .info { margin-top: 4.6cqi; }
  .ti { font-family: var(--f-head); font-weight: 400; font-size: clamp(1.45rem, 10.4cqi, 2.3rem); line-height: 0.96; letter-spacing: 0.01em; }
  .de { margin-top: 2cqi; font-size: clamp(0.8rem, 4.5cqi, 0.94rem); font-weight: 600; line-height: 1.4; color: rgba(255, 255, 255, 0.66); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 4.2em; }
  .ft { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; margin-top: 4cqi; }
  .pr { font-family: var(--f-head); font-size: clamp(1.9rem, 14cqi, 3rem); line-height: 0.9; color: var(--c); }
  .go { display: inline-flex; align-items: center; gap: 8px; padding: 0.5em 0.9em 0.4em; border: 2px solid var(--c); border-radius: 6px; color: var(--c); font-family: var(--f-head); font-size: clamp(1rem, 6.2cqi, 1.3rem); letter-spacing: 0.1em; line-height: 1; transition: background-color 220ms var(--ease-out), color 220ms var(--ease-out); }
  .go svg { transition: transform 240ms var(--ease-out); }

  .hoy { position: absolute; z-index: 4; left: 50%; top: -14px; translate: -50% 0; display: flex; align-items: center; gap: 7px; padding: 5px 12px 3px; border: 2px solid var(--c); border-radius: 999px; background: var(--ink); color: #fff; font-family: var(--f-head); font-size: 1.15rem; letter-spacing: 0.12em; line-height: 1; }
  .hoy i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); animation: blink 1.2s ease-in-out infinite; }

  /* Entrada: la foto se destapa de abajo hacia arriba y el neón se enciende (una sola vez) */
  .nc.in .ph { animation: reveal 900ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 100ms + 60ms); }
  @keyframes reveal { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  .nc.in .neon { animation: poweron 900ms steps(1, end) backwards; animation-delay: calc(var(--i) * 100ms + 120ms); }
  @keyframes poweron { 0% { opacity: 0; } 12% { opacity: 1; } 20% { opacity: 0.15; } 36% { opacity: 1; } 44% { opacity: 0.4; } 60% { opacity: 1; } }

  @media (hover: hover) and (pointer: fine) {
    .nc:hover { transform: translateY(-8px); }
    .nc:hover .ph img { transform: scale(1.08); }
    .nc:hover .neon::after { opacity: 1; }
    .nc:hover .sheen { animation: sheen 900ms var(--ease-out); }
    .nc:hover .go { background: var(--c); color: var(--ink); }
    .nc:hover .go svg { transform: translateX(4px); }
  }
  .nc:active { transform: translateY(-3px) scale(0.985); }
  @keyframes sheen { to { transform: translateX(130%); } }

  @media (max-width: 1000px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 38px; } }
  @media (max-width: 520px) { .cards { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; } }

  @media (prefers-reduced-motion: reduce) {
    .nc.in .day i, .nc.in .tag, .nc.in .ph, .nc.in .neon, .hoy i { animation: none; }
    .nc, .ph img, .go, .go svg, .neon::after { transition: none; }
  }
</style>
</head>
<body>
<main class="wall">
  <div class="marquee tape t1" aria-hidden="true"><div class="marquee-track" id="m1"></div></div>

  <header class="head">
    <span class="eyebrow">Cada día una excusa para comer</span>
    <h2 class="h2">
      <span class="stroke" id="stroke" aria-label="Promos"></span>
      <span class="hl">DE LA SEMANA</span>
    </h2>
    <a class="today" href="#cards"><span class="dot"></span><span id="todayT"></span></a>
  </header>

  <div class="stage"><div class="cards" id="cards"></div></div>

  <div class="marquee tape t2 rev" aria-hidden="true"><div class="marquee-track" id="m2"></div></div>
</main>

<script src="_shared.js"></script>
<script src="_wall.js"></script>
<script>
const ARROW = '<svg width="20" height="13" viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M0 7h19M13 1l6 6-6 6"/></svg>';
const cards = $("#cards");
PROMOS.forEach((p, i) => {
  const a = document.createElement("a");
  a.className = "nc";
  a.href = promoWa(p); a.target = "_blank"; a.rel = "noopener";
  a.style.cssText = `--c:${p.c};--i:${i}`;
  a.innerHTML = `
    ${i === TODAY_I ? '<span class="hoy"><i></i>HOY</span>' : ""}
    <span class="neon"></span>
    <div class="pad">
      <div class="top">
        <h3 class="day" aria-label="${p.day}">${[...p.day.toUpperCase()].map((ch, k) => `<i style="--k:${k}" aria-hidden="true">${ch}</i>`).join("")}</h3>
        <span class="tag">${p.badge}</span>
      </div>
      <div class="ph"><img src="${p.img}" alt="${p.title}" loading="lazy" draggable="false"><span class="sheen"></span></div>
      <div class="info">
        <h4 class="ti">${p.title}</h4>
        <p class="de">${p.desc}</p>
        <div class="ft"><span class="pr">${p.price}</span><span class="go">PEDIR ${ARROW}</span></div>
      </div>
    </div>`;
  cards.appendChild(a);
});
revealOnView(".nc", 0.18);
</script>
</body>
</html>
