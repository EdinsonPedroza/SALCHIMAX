<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ideas de diseño — Promos y Menú</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  .top { flex: none; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: rgba(13, 13, 13, 0.96); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .top::-webkit-scrollbar { display: none; }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--f-head); font-size: 1.35rem; letter-spacing: 0.08em; line-height: 1; }
  .brand img { height: 30px; width: 30px; border-radius: 50%; border: 2px solid var(--orange); object-fit: cover; }
  .brand small { display: block; margin-top: 3px; font-family: var(--f-body); font-size: 9px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); }
  .sep { width: 1px; height: 28px; background: var(--line); flex: none; }
  .grp { display: flex; align-items: center; gap: 6px; flex: none; }
  .tab { padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; color: rgba(255, 255, 255, 0.62); border: 1px solid transparent; white-space: nowrap; transition: color 200ms var(--ease-out), background-color 200ms var(--ease-out), border-color 200ms var(--ease-out), transform 160ms var(--ease-out); }
  .tab b { margin-right: 7px; font-weight: 800; color: rgba(255, 255, 255, 0.32); }
  .tab:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .tab:hover { color: #fff; background: rgba(255, 255, 255, 0.06); } }
  .tab.on { color: #fff; background: rgba(255, 102, 0, 0.16); border-color: rgba(255, 102, 0, 0.6); }
  .tab.on b { color: var(--orange); }

  .view { position: relative; flex: 1; min-height: 0; background: #000; }
  .view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }

  .cap { flex: none; z-index: 10; background: rgba(13, 13, 13, 0.98); border-top: 1px solid var(--line); }
  .cap-row { display: flex; align-items: center; gap: 18px; padding: 10px 16px; }
  .cap-row .t { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.45; color: rgba(255, 255, 255, 0.66); }
  .cap-row .t b { color: #fff; margin-right: 8px; }
  .cap-row button { flex: none; padding: 7px 13px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; border: 1px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.8); transition: background-color 200ms, transform 160ms var(--ease-out); }
  .cap-row button:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .cap-row button:hover { background: rgba(255, 255, 255, 0.08); } }
  .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 320ms var(--ease-out); }
  .more.open { grid-template-rows: 1fr; }
  .more > div { overflow: hidden; min-height: 0; }
  .more ul { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 28px; padding: 4px 16px 14px; font-size: 12px; line-height: 1.5; color: rgba(255, 255, 255, 0.6); }
  .more li b { display: block; margin-bottom: 2px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--orange); }
  @media (max-width: 760px) { .cap-row .t { font-size: 11.5px; } }
  @media (prefers-reduced-motion: reduce) { .more { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../frontend/public/logo.jpeg" alt="SalchiMax"><div>SALCHIMAX<small>Ideas · Promos y Menú</small></div></div>
  <span class="sep"></span>
  <nav class="grp" id="tabs" aria-label="Ideas"></nav>
</header>

<main class="view"><iframe id="frame" title="Prototipo"></iframe></main>

<footer class="cap">
  <div class="cap-row">
    <p class="t"><b id="capT"></b><span id="capD"></span></p>
    <button id="capB" aria-expanded="false">Cómo llevarlo a la landing ▴</button>
  </div>
  <div class="more" id="more"><div><ul id="notes"></ul></div></div>
</footer>

<script src="_shared.js"></script>
<script>
const IDEAS = [
  { file: "promos-1-muro-de-carteles.html", name: "Muro de carteles · callejera",
    desc: "Cuatro carteles pegados a la pared, cada uno de un color y con un ángulo distinto. Entran de un golpe («slap»), los días suben letra por letra y el sello 2x1 / COMBO / GRATIS se estampa. Cintas de precaución que aceleran con el scroll y un aviso «HOY ES…» que sabe qué día es.",
    react: "Cada cartel con motion.article y whileInView (once) · variants con staggerChildren para día → foto → sello · cintas con useAnimationFrame y useVelocity(scrollY) para la velocidad · el estado «hoy» sale de new Date().getDay(). En móvil: una columna, sin ángulos de más." },
  { file: "promos-1b-muro-calmado.html", name: "Muro calmado · menos saturada",
    desc: "La idea 1 con menos color: los carteles pasan a papel crema (o carbón, con el interruptor de arriba a la derecha) y el color de cada promo queda solo en el subrayado del día, el sello, la sombra y la cinta. La foto del producto resalta en vez de mimetizarse con un fondo naranja.",
    react: "Mismo código que la idea 1; el tono es un par de variables CSS (--pbg, --ptx, --acc…) por promo y una clase en el contenedor. El papel va en su propia capa para que la sombra de color quede detrás. En producción basta elegir un tono." },
  { file: "promos-2-dia-gigante.html", name: "Día gigante · intensa",
    desc: "Sección anclada: cada promo ocupa toda la pantalla. El color de la promo inunda la página desde la foto, el nombre del día (LUNES, JUEVES…) cae en cascada, la foto cambia con un corte diagonal y el precio / sello rebotan al entrar. Tira L M X J V S D abajo con marca «HOY».",
    react: "useScroll({ target }) + useTransform con mesetas por promo · inundación = clipPath: circle() animado · letras con useTransform y retardo por letra · precio y sello con useSpring de rebote (bounce) distinto al resto · la tira de la semana hace scrollTo a cada promo. En móvil la foto pasa arriba." },
  { file: "promos-3-cupones.html", name: "Cupones que se rasgan · lúdica",
    desc: "Cada promo es un cupón troquelado con código de barras. Se «imprimen» uno a uno desde una impresora, se inclinan en 3D con brillo siguiendo el mouse y, al tocarlos, el talón se rasga y sale volando mientras se abre WhatsApp. El cupón de hoy insinúa el rasgado.",
    react: "Entrada con motion + clipPath (inset) y delay por índice · tilt con useMotionValue + useSpring (solo pointer: fine) · rasgado = estado local `torn` con variants (talón: x, y, rotate, opacity) y un timeout que lo devuelve · el enlace sigue siendo un <a href='wa.me/…'> real." },
  /* Segunda ronda: tarjetas nuevas para la idea 1 (mismo encabezado y cintas, sin look de papel) */
  { sep: true, file: "promos-4-vitrina.html", name: "Vitrina limpia · sin neón",
    desc: "La vitrina sin neón: tarjeta oscura con borde neutro y la foto libre, sin nada encima. El día y el sello van arriba, el texto abajo, y el color de la promo solo aparece en el día, el precio y el botón. Al pasar: la tarjeta sube, el borde toma el color y un destello cruza la foto.",
    react: "motion.a con whileInView y delay por índice · foto destapada con clipPath inset · borde que cambia de color con una transición (sin sombras animadas) · el color de cada promo como variable CSS (--c). En móvil: 1–2 columnas." },
  { file: "promos-4b-vitrina-etiqueta.html", name: "Etiqueta de precio · cristal",
    desc: "Una vitrina de cristal: marco doble como la puerta, un destello fijo sobre el vidrio y un estante bajo el producto. El precio es una etiqueta colgada que cae al entrar y se balancea al pasar el mouse.",
    react: "Etiqueta con clipPath polygon y un agujero (pseudo-elemento) · caída con variants y balanceo con animate({ rotate: [−4, 11, −8, 3, −4] }) con origen en el agujero · estante y marco son solo bordes y degradados." },
  { file: "promos-4c-vitrina-foco.html", name: "Con foco · centrada",
    desc: "Una luz cae desde arriba sobre el producto con un degradado suave del color de la promo (sin brillos). Todo va centrado, como un objeto expuesto: el día entre dos líneas, la foto, el precio con su sello y el botón a todo el ancho.",
    react: "Fondo con radial-gradient + cono con clipPath polygon que se «enciende» (opacidad) al entrar y sube al pasar el mouse · color-mix para mezclar el color de la promo con el fondo · solo transform y opacity en las animaciones." },
  { file: "promos-4d-vitrina-museo.html", name: "De museo · sobria",
    desc: "El plato como obra enmarcada: paspartú crema, rótulo en versalitas («Nº 01 · LUNES»), placa con el precio y un botón de texto con subrayado que se dibuja. La más sobria: casi nada de color y mucho espacio.",
    react: "Paspartú con clipPath inset desde el centro («revelado») y la foto asentándose con scale · subrayado con scaleX y origen izquierdo · rótulo con letter-spacing y text-transform. Ideal si quieres que el producto sea lo único con color." },
  { file: "promos-5-persianas.html", name: "Persianas · acordeón",
    desc: "Cuatro franjas de color en una sola fila (todo cabe en una pantalla). Al pasar el mouse o tocar, una se abre con la foto grande, el precio y el botón mientras las otras se cierran y quedan como un lomo con el día en vertical. Pasa sola cada 5 s con una barra de tiempo.",
    react: "Estado `active` + grid-template-columns animado con variables (la única animación de layout, justificada: 4 elementos y comportamiento de acordeón) · panel con ancho fijo y opacidad/transform con retardo · sello que se estampa al abrir · autoplay con onAnimationEnd de la barra · flechas del teclado y foco. En móvil: franjas apiladas." },
  { file: "promos-6-chapas.html", name: "Chapas · medallones",
    desc: "Cada promo es una chapa de botella: borde dentado, foto circular y el texto «LUNES ★ DE 2 PA' 2 ★ $46.000» girando alrededor. Caen y rebotan al entrar; al pasar el mouse el anillo acelera con un resorte y la chapa se inclina. Debajo, el texto y el botón.",
    react: "SVG con textPath (el texto se ajusta con textLength) y rotación con CSS · aceleración con useSpring sobre animation.playbackRate · entrada con keyframes de caída y rebote o animate() con tipo spring · dentado con clipPath polygon. En móvil: 2 columnas." },
  /* Menú: tres ideas para la sección "Nuestro menú" (con los platos y precios reales) */
  { sep: true, file: "menu-1-carta-gigante.html", name: "Carta gigante · tipográfica",
    desc: "Las categorías son rótulos enormes en contorno; al abrir una, un relleno naranja la recorre de izquierda a derecha y los platos se listan como una carta de restaurante (nombre ........ precio). A la derecha, un visor fijo muestra la foto del plato que señalas. Porciones y «Agregar» en cada renglón.",
    react: "Acordeón con estado open y grid-template-rows 0fr→1fr · relleno con un pseudo-elemento y clipPath inset · visor sticky con una imagen por plato y opacidad (sin remontar) · en móvil el visor desaparece y cada renglón trae su miniatura. Entradas sin deslizamientos." },
  { file: "menu-2-bento.html", name: "Bento de tinta · foto grande",
    desc: "Botones de categoría macizos con sombra dura y un bento donde el primer plato ocupa 2×2. Al pasar el mouse (o tocar), un círculo naranja nace donde está el cursor y descubre el detalle: descripción, porciones, precio y «Agregar». Al cambiar de categoría los platos aparecen con un escalonado suave.",
    react: "Tarjeta con clipPath: circle(r at x y) animado desde la posición del puntero (variables CSS --x/--y) · bento con CSS grid y grid-auto-flow: dense · clic fija el detalle con el mouse; en táctil, toque abre/cierra · visibility para que lo oculto no tome el foco." },
  { file: "menu-3-carrusel.html", name: "Carrusel cinematográfico",
    desc: "Las categorías son lomos verticales de color. Los platos corren en horizontal con snap: el del centro se agranda y se aclara, y el nombre gigante en contorno va detrás con paralaje (más lento que la foto). Flechas, teclado, arrastre con mouse y contador 02 / 08 con barra de progreso.",
    react: "scroll-snap-type: x mandatory + un solo listener de scroll con requestAnimationFrame que escribe transform/opacity (sin layout) · paralaje con translate3d por plato · arrastre con pointer events solo para mouse · flechas con scrollIntoView · carrusel accesible con aria-roledescription." },
  /* Menú · ronda 2: cinco ideas sobrias (nada de neón ni saturación) con el encabezado real de la landing */
  { sep: true, file: "menu-4-spotlight.html", name: "Spotlight · cuadrícula",
    desc: "La cuadrícula actual, afinada: borde fino que se enciende con un resplandor que sigue al cursor, pestañas con un indicador que se desliza (fondo y texto cambian a la vez), porciones como control segmentado con pulgar deslizante y un botón «+» que se abre a «AGREGADO ✓».",
    react: "Resplandor con dos capas (borde + halo) cuya opacidad cambia al pasar el mouse y variables --mx/--my escritas solo en tarjetas con mouse · pestañas con clip-path en una copia «activa» de la lista · pulgar con transform: translateX · botón con clip-path. Sin deslizamientos de entrada." },
  { file: "menu-5-domicilio.html", name: "Domicilio · compacta",
    desc: "Pensada para pedir rápido: tarjetas horizontales con foto cuadrada, chips de porción y el precio. «Agregar» se convierte en un contador − 1 + en el mismo sitio. Barra de pedido flotante con el total que cuenta hacia arriba. Categorías pegajosas arriba.",
    react: "Mapa de pedido en el contexto actual (CartContext) · contador con dos capas que se cruzan (opacidad) sin cambiar de tamaño · total animado con un contador numérico (useSpring/useMotionValue) · barra con AnimatePresence · chips de categoría en una barra sticky." },
  { file: "menu-6-escaparate.html", name: "Escaparate · foto + lista",
    desc: "Una sola foto grande a la vez (con su ficha: descripción, porciones, precio y Agregar) y a su lado la lista de platos. Al elegir uno la foto se cruza y la ficha cambia con un fundido corto. Flechas ↑ ↓ para recorrer. En móvil la ficha va arriba.",
    react: "Estado selectedIndex · imágenes apiladas con opacidad y transform (no se remontan) · ficha con AnimatePresence mode=wait y duración de 150 ms · indicador lateral con scaleY · lista accesible con aria-pressed y roving tabindex." },
  { file: "menu-7-carta.html", name: "Carta · vista previa",
    desc: "Una carta de restaurante: nombre ........ precio, descripción fina y una línea naranja que se dibuja bajo el plato señalado. La foto aparece flotando junto al cursor con un resorte y se inclina un poco según la velocidad. Sin mouse: miniaturas fijas.",
    react: "Foto única con position: fixed y useSpring en x/y (solo con pointer: fine) · tilt con useVelocity · la posición se escribe con transform (sin layout) · línea con scaleX y origen izquierdo · en táctil se cambia por una miniatura en cada fila." },
  { file: "menu-8-detalle.html", name: "Detalle compartido · sheet",
    desc: "Cuadrícula compacta (foto, nombre y precio). Al tocar un plato, su foto vuela y crece hasta la ficha completa con porciones, cantidad y total; al cerrar vuelve a su sitio. En celular se abre como una hoja desde abajo. Esc, clic fuera y atrapa el foco.",
    react: "layoutId compartido en Framer Motion (la foto) + AnimatePresence · hoja móvil con la curva del drawer y arrastre para cerrar (drag=\"y\") · Radix Dialog para foco y aria-modal · el resto de la página queda inert · total = precio × cantidad." },
];
const NOTES = [
  ["Datos", "Las tres leen la misma lista que frontend/src/data/promos.js (día, título, descripción, precio, badge, foto, active). Cambiar una promo no requiere tocar el diseño."],
  ["«Hoy»", "Resalta la promo del día con new Date().getDay(). Si hoy no hay promo, la idea 1 avisa cuál es la siguiente. Para probar otro día: agrega ?hoy=0..6 a la URL de cada prototipo."],
  ["Entradas", "Ninguna idea del menú entra deslizándose hacia arriba: usan fundidos, sellos, recortes en círculo y desplazamientos horizontales."],
  ["Rendimiento", "Todo se mueve con transform y opacity (más clip-path en los recortes). Nada anima width, height ni top/left. Curvas: ease-out fuerte cubic-bezier(.23,1,.32,1) y ease-in-out cubic-bezier(.77,0,.175,1)."],
  ["Accesibilidad", "prefers-reduced-motion: sin cintas, sin inclinaciones y el estado final fijo. Hover solo con mouse (hover: hover). Toda la CTA es un enlace real a WhatsApp con el mensaje de la promo."],
];

const frame = $("#frame"), capT = $("#capT"), capD = $("#capD"), notes = $("#notes"), more = $("#more"), capB = $("#capB");
const LABELS = ["1", "1b", "2", "3", "4", "4b", "4c", "4d", "5", "6", "M1", "M2", "M3", "M4", "M5", "M6", "M7", "M8"];   // 1b: la 1 más calmada · 4b–4d: otras vitrinas
const tabs = IDEAS.map((it, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.innerHTML = `<b>${LABELS[i]}</b>${it.name}`;
  b.addEventListener("click", () => select(i));
  if (it.sep) { const s = document.createElement("span"); s.className = "sep"; s.setAttribute("aria-hidden", "true"); $("#tabs").appendChild(s); }
  $("#tabs").appendChild(b);
  return b;
});

function select(i) {
  const it = IDEAS[i];
  tabs.forEach((t, k) => { t.classList.toggle("on", k === i); t.setAttribute("aria-current", k === i ? "true" : "false"); });
  frame.src = it.file + location.search;
  capT.textContent = `${it.file.startsWith("menu-") ? "Menú" : "Promos"} · ${it.name}`;
  capD.textContent = it.desc;
  notes.innerHTML = `<li><b>En React + Framer Motion</b>${it.react}</li>` + NOTES.map(([t, d]) => `<li><b>${t}</b>${d}</li>`).join("");
  history.replaceState(null, "", location.search + "#" + (i + 1));
}
capB.addEventListener("click", () => {
  const open = more.classList.toggle("open");
  capB.setAttribute("aria-expanded", String(open));
  capB.textContent = open ? "Cómo llevarlo a la landing ▾" : "Cómo llevarlo a la landing ▴";
});
/* Teclas 1–6 para las ideas; B abre la 1b y M la primera del menú */
addEventListener("keydown", (e) => { const j = LABELS.indexOf(e.key === "b" || e.key === "B" ? "1b" : /^[mM]$/.test(e.key) ? "M1" : e.key); if (j >= 0) select(j); });
select(clamp((parseInt(location.hash.slice(1), 10) || 1) - 1, 0, IDEAS.length - 1));
</script>
</body>
</html>
