<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menú · Idea 1 — Carta gigante</title>
<link rel="stylesheet" href="_shared.css">
<link rel="stylesheet" href="_menu.css">
<style>
  .board { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.9fr); gap: clamp(24px, 4vw, 64px); align-items: start; }

  /* Categorías: rótulos enormes en contorno. Al abrir, un relleno naranja las recorre de izquierda a derecha. */
  .cat { border-top: 2px solid rgba(255, 255, 255, 0.16); }
  .cat:last-child { border-bottom: 2px solid rgba(255, 255, 255, 0.16); }
  .cat-btn { display: flex; align-items: center; gap: clamp(10px, 2vw, 24px); width: 100%; padding: clamp(8px, 1.2vw, 16px) 0; text-align: left; }
  .no { flex: none; width: 2.4em; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.45); }
  .cname { position: relative; flex: 0 1 auto; min-width: 0; font-family: var(--f-head); font-size: clamp(2.6rem, 7.2vw, 6.6rem); line-height: 0.92; letter-spacing: 0.01em; color: transparent; -webkit-text-stroke: 2px #fff; white-space: nowrap; }
  .cname::before { content: attr(data-t); position: absolute; left: 0; top: 0; color: var(--orange); -webkit-text-stroke: 0; clip-path: inset(0 100% 0 0); transition: clip-path 560ms var(--ease-io); }
  .cat.open .cname::before { clip-path: inset(0 0 0 0); }
  .cnt { margin-left: auto; flex: none; padding: 3px 11px 1px; border: 2px solid rgba(255, 255, 255, 0.5); font-family: var(--f-head); font-size: clamp(1.1rem, 1.8vw, 1.6rem); line-height: 1; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.8); transition: background-color 200ms var(--ease-out), color 200ms var(--ease-out), border-color 200ms var(--ease-out); }
  .cat.open .cnt { background: var(--orange); border-color: var(--orange); color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .cat:not(.open) .cat-btn:hover .cname::before { clip-path: inset(0 78% 0 0); } }

  /* Acordeón: se anima la altura de la fila (única animación de layout; es un acordeón) */
  .cat-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 560ms var(--ease-out); }
  .cat.open .cat-panel { grid-template-rows: 1fr; }
  .cat-in { overflow: hidden; min-height: 0; }
  .items { list-style: none; padding: 4px 0 clamp(14px, 2vw, 26px) calc(2.4em + clamp(10px, 2vw, 24px)); }

  /* Plato como renglón de carta: nombre ........ precio */
  .it { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); padding: 11px 0 12px; border-bottom: 1px dashed rgba(255, 255, 255, 0.14); outline-offset: 2px; }
  .it:last-child { border-bottom: 0; }
  .th { display: none; width: 58px; height: 58px; object-fit: cover; border-radius: 8px; }
  .line { display: flex; align-items: baseline; gap: 10px; }
  .n { font-family: var(--f-head); font-size: clamp(1.4rem, 2.1vw, 1.9rem); line-height: 1; letter-spacing: 0.02em; transition: color 180ms var(--ease-out); }
  .lead { flex: 1; min-width: 20px; border-bottom: 2px dotted rgba(255, 255, 255, 0.28); transform: translateY(-4px); }
  .p { font-family: var(--f-head); font-size: clamp(1.4rem, 2.1vw, 1.9rem); line-height: 1; color: var(--orange); }
  .d { grid-column: 1 / -1; margin-top: 4px; font-size: 0.84rem; font-weight: 600; line-height: 1.4; color: rgba(255, 255, 255, 0.6); }
  .it.active .n { color: var(--orange); }
  .act { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-top: 9px; }
  .opts { color: var(--orange); }
  .opt[aria-pressed="true"] { background: var(--orange); color: var(--ink); }
  .add { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 6px; border: 2px solid var(--orange); color: var(--orange); font-family: var(--f-head); font-size: 1.1rem; letter-spacing: 0.12em; line-height: 1; transition: background-color 180ms var(--ease-out), color 180ms var(--ease-out), transform 160ms var(--ease-out); }
  .add:active { transform: scale(0.96); }
  .add.done { background: #1f9d55; border-color: #1f9d55; color: #fff; }
  @media (hover: hover) and (pointer: fine) { .add:not(.done):hover { background: var(--orange); color: var(--ink); } .opt:hover { background: rgba(255, 102, 0, 0.18); } }

  /* Visor fijo con la foto del plato que se señala */
  .viewer { position: sticky; top: 28px; }
  .vframe { position: relative; aspect-ratio: 4 / 5; border: 3px solid var(--paper); background: #0a0a0a; }
  .vframe::after { content: ""; position: absolute; inset: -3px; z-index: -1; background: var(--orange); transform: translate(12px, 12px); }
  .vframe .vi { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.04); transition: opacity 360ms var(--ease-out), transform 600ms var(--ease-out); }
  .vframe .vi.on { opacity: 1; transform: scale(1); }
  .vcap { margin-top: clamp(26px, 3vw, 36px); }
  .vcap h3 { font-family: var(--f-head); font-weight: 400; font-size: clamp(2.2rem, 3.4vw, 3.2rem); line-height: 0.95; }
  .vcap p { margin-top: 8px; font-size: 0.92rem; font-weight: 600; line-height: 1.45; color: rgba(255, 255, 255, 0.68); }
  .vcap .swap { animation: mfade 320ms var(--ease-out); }

  @media (max-width: 960px) {
    .board { grid-template-columns: 1fr; }
    .viewer { display: none; }
    .items { padding-left: 0; }
    .th { display: block; grid-column: 1; grid-row: 1 / span 3; }
    .it { grid-template-columns: 58px minmax(0, 1fr); column-gap: 12px; }
    .line, .d, .act { grid-column: 2; }
    .no { width: 1.8em; }
  }
  @media (max-width: 480px) { .cname { font-size: clamp(2.2rem, 11.5vw, 3.4rem); } .cnt { font-size: 1rem; padding: 2px 8px 0; } .n, .p { font-size: 1.3rem; } }

  @media (prefers-reduced-motion: reduce) {
    .cname::before, .cat-panel, .vframe .vi, .vcap .swap, .add, .cnt { transition: none; animation: none; }
  }
</style>
</head>
<body>
<main class="mwrap">
  <header class="mhead">
    <span class="eyebrow">Lo que más te gusta</span>
    <h2 class="mh2" aria-label="Nuestro menú"><span class="stroke" id="mstroke"></span><span class="hl" aria-hidden="true">MENÚ</span></h2>
  </header>

  <div class="board">
    <div class="cats" id="cats"></div>
    <aside class="viewer" id="viewer" aria-live="polite">
      <div class="vframe" id="vframe"></div>
      <div class="vcap"><h3 id="vname"></h3><p id="vdesc"></p></div>
    </aside>
  </div>
</main>

<script src="_shared.js"></script>
<script src="_menu.js"></script>
<script>
grain(); mountMenuHead(); mountCart();
const cats = $("#cats"), vframe = $("#vframe"), vname = $("#vname"), vdesc = $("#vdesc");

/* Una imagen por plato, todas apiladas en el visor; se enciende la que se señala */
const vis = new Map();
let activeCat = -1;

function show(item) {
  vis.forEach((im) => im.classList.remove("on"));
  vis.get(item)?.classList.add("on");
  const cap = $(".vcap"); cap.classList.remove("swap"); void cap.offsetWidth; cap.classList.add("swap");
  vname.textContent = item.name; vdesc.textContent = item.desc;
}

MENU_CATS.forEach((cat, ci) => {
  const items = MENU[cat.id];
  const sec = document.createElement("section");
  sec.className = "cat";
  sec.innerHTML = `
    <button class="cat-btn" aria-expanded="false" aria-controls="p${ci}">
      <span class="no">${pad(ci + 1)}</span>
      <span class="cname" data-t="${cat.label.toUpperCase()}">${cat.label.toUpperCase()}</span>
      <span class="cnt" aria-label="${items.length} platos">${items.length}</span>
    </button>
    <div class="cat-panel" id="p${ci}"><div class="cat-in"><ul class="items"></ul></div></div>`;
  const ul = $(".items", sec);

  items.forEach((item) => {
    const opts = portions(item);
    let sel = 0;
    const li = document.createElement("li");
    li.className = "it"; li.tabIndex = 0;
    li.innerHTML = `
      <img class="th" src="${item.img}" alt="" loading="lazy" draggable="false">
      <div class="line"><span class="n">${item.name}</span><i class="lead"></i><span class="p">${opts ? opts[0].price : item.price}</span></div>
      <p class="d">${item.desc}</p>
      <div class="act">
        ${opts ? `<div class="opts" role="group" aria-label="Porción">${opts.map((o, k) => `<button class="opt" aria-pressed="${k === 0}" data-k="${k}">${o.label}<b>${o.price}</b></button>`).join("")}</div>` : "<span></span>"}
        <button class="add">+ AGREGAR</button>
      </div>`;
    // porción elegida → cambia el precio del renglón
    $$(".opt", li).forEach((b) => b.addEventListener("click", () => {
      sel = +b.dataset.k;
      $$(".opt", li).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      $(".p", li).textContent = opts[sel].price;
    }));
    const add = $(".add", li);
    add.addEventListener("click", () => {
      cartAdd(); add.classList.add("done"); add.textContent = "AGREGADO ✓";
      setTimeout(() => { add.classList.remove("done"); add.textContent = "+ AGREGAR"; }, 1500);
    });
    const point = () => { if (sec.classList.contains("open")) { $$(".it", ul).forEach((x) => x.classList.toggle("active", x === li)); show(item); } };
    li.addEventListener("pointerenter", point); li.addEventListener("focusin", point);
    ul.appendChild(li);

    // imagen del visor
    const im = document.createElement("img"); im.className = "vi"; im.src = item.img; im.alt = item.name; im.loading = "lazy"; im.draggable = false;
    vframe.appendChild(im); vis.set(item, im);
  });

  const btn = $(".cat-btn", sec);
  btn.addEventListener("click", () => open(ci));
  cats.appendChild(sec);
});

function open(ci) {
  const secs = $$(".cat", cats);
  const already = ci === activeCat;
  secs.forEach((s, k) => { const o = k === ci && !already; s.classList.toggle("open", o); $(".cat-btn", s).setAttribute("aria-expanded", String(o)); });
  activeCat = already ? -1 : ci;
  if (activeCat >= 0) { const first = MENU[MENU_CATS[ci].id][0]; $$(".it", secs[ci]).forEach((x, k) => x.classList.toggle("active", k === 0)); show(first); }
}
open(0);
</script>
</body>
</html>
